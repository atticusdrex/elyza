[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elyza"
version = "0.1.1"
description = "A jax-based library for efficient multifidelity surrogate modeling and uncertainty quantification."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [{ name = "Atticus Rex" }]
dependencies = [
  "numpy>=1.24",
  "jax>=0.4",
  "jaxlib>=0.4",
  "pydantic>=2.0",
  "tqdm>=4.0",
  "pillow>=12.3.0", 
  "scipy>=1.17.1"
]

[project.optional-dependencies]
dev = ["build", "twine", "pytest"]
docs = ["sphinx", "sphinx_rtd_theme", "sphinx_book_theme", "myst-nb", "ipykernel"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
